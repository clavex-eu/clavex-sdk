# Publishes the Python package to PyPI when a tag like `py-1.2.3` is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token needed. Configure the
# publisher on PyPI first: project `clavex-webhooks`, owner `clavex-eu`,
# repository `clavex-sdk`, workflow `release-pypi.yml`, environment `pypi`.
name: release-pypi

on:
  push:
    tags:
      - 'py-*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    defaults:
      run:
        working-directory: python/clavex-webhooks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/clavex-webhooks/dist
